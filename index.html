<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>올리 (All-Re) - 100개 웹사이트 통합 관리 포털</title>
    <meta name="description" content="내가 직접 만드는 100개의 웹사이트 프로젝트 통합 관리 포털 및 성과 측정 대시보드">
    
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-section">
                <h1>All-Re <span class="logo-glow">올리</span></h1>
                <p>1인 기업가의 100개 웹서비스 빌드 챌린지 통합 허브</p>
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button id="btn-toggle-sandbox" class="btn-secondary" style="padding: 0.6rem 1.2rem; font-size: 0.85rem; border-color: rgba(244, 63, 94, 0.4); color: #fb7185;" aria-label="아이디어 샌드박스 열기">
                    💡 아이디어 보드
                </button>
                <button id="btn-export" class="btn-secondary" style="padding: 0.6rem 1.2rem; font-size: 0.85rem;" aria-label="데이터 백업">
                    📤 백업 (Export)
                </button>
                <button id="btn-import-trigger" class="btn-secondary" style="padding: 0.6rem 1.2rem; font-size: 0.85rem;" aria-label="데이터 복원">
                    📥 복원 (Import)
                </button>
                <input type="file" id="import-file" style="display: none;" accept=".json">
                <button id="btn-add-site" class="btn-primary" style="padding: 0.65rem 1.3rem; font-size: 0.9rem;" aria-label="새 웹사이트 추가">
                    <span>+</span> 새 웹사이트 등록
                </button>
            </div>
        </header>

        <!-- Challenge Progress Tracker -->
        <section class="challenge-board">
            <div class="challenge-header">
                <div class="challenge-title">
                    <span>🏆</span> 100개 웹사이트 빌딩 목표 달성도
                </div>
                <div class="challenge-count">
                    <span id="total-count-val">0</span> / 100
                </div>
            </div>
            
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
            </div>

            <!-- Financial Summary Banner -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2rem; margin-bottom: 1.5rem; background: rgba(139, 92, 246, 0.05); padding: 1.2rem; border-radius: 14px; border: 1px solid rgba(139, 92, 246, 0.1);">
                <div style="display: flex; align-items: center; gap: 0.8rem;">
                    <div style="font-size: 2.2rem;">💰</div>
                    <div>
                        <div class="stat-label" style="font-size: 0.85rem; font-weight: 600; color: #a78bfa;">총 월 예상 수익</div>
                        <div id="stat-total-revenue" style="font-size: 1.8rem; font-weight: 800; color: #f43f5e; text-shadow: 0 0 10px rgba(244, 63, 94, 0.3);">0원</div>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 0.8rem;">
                    <div style="font-size: 2.2rem;">📈</div>
                    <div>
                        <div class="stat-label" style="font-size: 0.85rem; font-weight: 600; color: #6ee7b7;">총 월 활성 방문자</div>
                        <div id="stat-total-visitors" style="font-size: 1.8rem; font-weight: 800; color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);">0명</div>
                    </div>
                </div>
            </div>

            <!-- Stats breakdown cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">운영 중인 웹</span>
                    <span id="stat-active" class="stat-value" style="color: #10b981;">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">개발 중인 웹</span>
                    <span id="stat-dev" class="stat-value" style="color: #f59e0b;">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">AI / 3D 서비스</span>
                    <span id="stat-ai" class="stat-value" style="color: #a78bfa;">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">게임 카테고리</span>
                    <span id="stat-game" class="stat-value" style="color: #f43f5e;">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">비즈니스 도구</span>
                    <span id="stat-biz" class="stat-value" style="color: #6ee7b7;">0</span>
                </div>
            </div>
        </section>

        <!-- Filters & Search Control Panel -->
        <section class="controls-panel">
            <!-- Search & Sort -->
            <div class="search-and-sort">
                <div class="search-box-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-box" class="search-box" placeholder="이름, 설명 또는 태그 검색..." aria-label="웹사이트 검색">
                </div>
                
                <select id="sort-select" class="sort-select" aria-label="정렬 방식">
                    <option value="name">이름 가나다순</option>
                    <option value="dateNew">최근 등록순</option>
                    <option value="dateOld">오래된 등록순</option>
                    <option value="status">상태별 정렬</option>
                </select>
            </div>

            <!-- Category Switcher -->
            <div class="category-tabs">
                <button class="tab-btn active" onclick="filterByCategory('all', this)">전체</button>
                <button class="tab-btn" onclick="filterByCategory('ai', this)">AI & 3D</button>
                <button class="tab-btn" onclick="filterByCategory('game', this)">게임 (Game)</button>
                <button class="tab-btn" onclick="filterByCategory('business', this)">비즈니스 (Biz)</button>
                <button class="tab-btn" onclick="filterByCategory('utility', this)">유틸리티 (Utility)</button>
            </div>

            <!-- Tag Filter Cloud -->
            <div id="tag-filters" class="tag-filters">
                <!-- Tag buttons dynamically populated by JS -->
            </div>
        </section>

        <!-- Web Cards Grid -->
        <main id="cards-grid" class="cards-grid">
            <!-- Cards dynamically populated by JS -->
        </main>
    </div>

    <!-- Add/Edit Modal Overlay -->
    <div id="site-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title" class="modal-title">새 웹사이트 등록</h2>
                <button id="btn-close-modal" class="btn-close-modal" aria-label="모달 닫기">&times;</button>
            </div>
            
            <form id="site-form">
                <div class="form-group">
                    <label for="site-name">웹사이트 이름 *</label>
                    <input type="text" id="site-name" class="form-control" placeholder="예: MIRAI STUDIO" required>
                </div>
                
                <div class="form-group">
                    <label for="site-url">실행 경로 / URL *</label>
                    <input type="text" id="site-url" class="form-control" placeholder="예: ../미디어파이프활용-사업웹/index.html 또는 http://localhost:8080" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="site-category">분류 카테고리 *</label>
                        <select id="site-category" class="form-control" required>
                            <option value="ai">AI / 3D</option>
                            <option value="game">게임 (Game)</option>
                            <option value="business">비즈니스 (Biz)</option>
                            <option value="utility">유틸리티 (Utility)</option>
                            <option value="etc">기타 (Etc)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="site-status">개발 및 운영 상태 *</label>
                        <select id="site-status" class="form-control" required>
                            <option value="active">운영 중 (Active)</option>
                            <option value="dev">개발 중 (In Dev)</option>
                            <option value="planned">기획 단계 (Planned)</option>
                        </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.2rem; margin-bottom: 1.2rem;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="site-revenue">월 예상 수익 (원)</label>
                        <input type="number" id="site-revenue" class="form-control" placeholder="0" min="0">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="site-visitors">월 활성 방문자 수 (명)</label>
                        <input type="number" id="site-visitors" class="form-control" placeholder="0" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label for="site-tags">태그 (쉼표로 구분)</label>
                    <input type="text" id="site-tags" class="form-control" placeholder="예: Three.js, AI, Vision, 3D">
                </div>

                <div class="form-group">
                    <label for="site-desc">웹사이트 설명 *</label>
                    <textarea id="site-desc" class="form-control" placeholder="이 웹사이트의 핵심 기능과 비즈니스 가치를 기재해 주세요." required></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" id="btn-delete-site" class="btn-danger" style="display: none;">삭제</button>
                    <button type="button" class="btn-secondary" onclick="closeModal()">취소</button>
                    <button type="submit" class="btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Idea Sandbox Drawer -->
    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <div id="sandbox-drawer" class="sandbox-drawer" role="complementary" aria-label="아이디어 샌드박스">
        <div class="sandbox-header">
            <h2 class="sandbox-title">💡 아이디어 샌드박스</h2>
            <button id="btn-close-sandbox" class="btn-close-sandbox" aria-label="샌드박스 닫기">&times;</button>
        </div>
        
        <form id="sandbox-form" class="sandbox-form">
            <div class="form-group" style="margin-bottom: 0.8rem;">
                <input type="text" id="idea-title-input" class="form-control" placeholder="아이디어 이름..." required style="padding: 0.6rem 0.8rem; font-size: 0.9rem;">
            </div>
            <div class="form-group" style="margin-bottom: 0.8rem;">
                <textarea id="idea-desc-input" class="form-control" placeholder="핵심 내용 요약..." required style="padding: 0.6rem 0.8rem; font-size: 0.85rem; min-height: 60px;"></textarea>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; padding: 0.5rem; font-size: 0.85rem; justify-content: center; background: linear-gradient(135deg, #f43f5e 0%, #8b5cf6 100%); box-shadow: 0 4px 10px rgba(244, 63, 94, 0.3);">
                아이디어 추가
            </button>
        </form>

        <div id="sandbox-list" class="sandbox-list">
            <!-- Ideas dynamically populated by JS -->
        </div>
    </div>

    <!-- JS Logic -->
    <script src="app.js"></script>
</body>
</html>
